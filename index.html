<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jogo de Nave - Arcade</title>
    <style>
        * { box-sizing: border-box; touch-action: none; font-family: 'Courier New', Courier, monospace; }
        body {
            margin: 0; padding: 0; background-color: #050508; color: white;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        #game-container, #menu, #base-container {
            width: 100vw; height: 100vh; 
            max-width: calc(100vh * (9 / 16)); 
            max-height: 100vh;
            aspect-ratio: 9 / 16; 
            border: 2px solid #333;
            box-shadow: 0 0 25px rgba(0, 255, 200, 0.15);
            position: relative; 
            overflow: hidden;
        }

        #game-container {
            display: none; 
        }

        #base-container {
            display: none;
            background: linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.35)), url('assets/mundo_vermelho.png') no-repeat center center;
            background-size: cover;
            z-index: 10;
        }

        #menu {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('assets/fundomenu.gif') no-repeat center center;
            background-size: cover;
            display: flex; flex-direction: column;
            z-index: 10;
        }

        canvas {
            width: 100%; height: 100%; display: block;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url('assets/fundofase.gif') no-repeat center center;
            background-size: cover;
        }

        #explosions-layer {
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            pointer-events: none; 
            z-index: 5;
        }

        .gif-explosao {
            position: absolute; 
            transform: translate(-50%, -50%); 
            pointer-events: none;
        }

        /* --- DISPLAY DE MOEDAS E GEMAS --- */
        .top-ui-container {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: flex-end; align-items: center;
            z-index: 11;
        }

        .currency-display {
            display: flex; gap: 10px; align-items: center;
        }

        .currency-item {
            font-size: 16px; font-weight: bold; padding: 6px 12px; 
            background: rgba(0,0,0,0.85); border-radius: 6px; font-family: Arial, sans-serif;
        }
        .currency-item.gems { color: #00e5ff; border: 3px solid #00e5ff; box-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        .currency-item.coins { color: #ffeb3b; border: 3px solid #ffeb3b; box-shadow: 0 0 10px rgba(255, 235, 59, 0.3); }
        
        /* --- LOJA FIXA NO TOPO DO MENU --- */
        .store-top-bar {
            position: absolute; top: 75px; left: 15px; right: 15px;
            background: rgba(17, 17, 25, 0.95); border: 3px solid #ff00ff; border-radius: 8px;
            padding: 10px; z-index: 11; box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
            display: flex; flex-direction: column; gap: 8px; text-align: center;
        }
        .store-top-title { color: #ff00ff; font-size: 14px; font-weight: bold; font-family: Arial, sans-serif; text-shadow: 1px 1px #000; margin: 0; }
        .store-items-row { display: flex; gap: 8px; justify-content: space-between; }
        
        .store-mini-btn {
            background: #000; border: 2px solid; padding: 6px 8px; font-weight: bold; cursor: pointer;
            font-size: 11px; text-transform: uppercase; border-radius: 4px; flex: 1; transition: 0.2s;
            font-family: Arial, sans-serif;
        }
        .store-mini-btn.buy-gem { border-color: #00e5ff; color: #00e5ff; }
        .store-mini-btn.buy-gem:hover { background: #00e5ff; color: #000; }
        .store-mini-btn.buy-coin { border-color: #ffeb3b; color: #ffeb3b; }
        .store-mini-btn.buy-coin:hover { background: #ffeb3b; color: #000; }

        .center-area {
            flex: 1; display: flex; align-items: center; justify-content: center;
            flex-direction: column; padding-top: 130px; padding-bottom: 250px;
        }
        .btn-play {
            background: #000; border: 4px solid #00ffcc; color: #00ffcc;
            padding: 16px 40px; font-size: 28px; font-weight: bold;
            cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); transition: 0.2s;
            border-radius: 4px;
        }
        .btn-play:hover { background: #00ffcc; color: #000; box-shadow: 0 0 30px rgba(0, 255, 204, 0.8); }

        .btn-base {
            background: #000; border: 4px solid #ff6600; color: #ff6600;
            padding: 12px 32px; font-size: 18px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; margin-top: 14px;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.3); transition: 0.2s;
            border-radius: 4px;
        }
        .btn-base:hover { background: #ff6600; color: #000; box-shadow: 0 0 30px rgba(255, 102, 0, 0.8); }

        .bottom-area {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(10,10,15,0.98) 85%, rgba(10,10,15,0) 100%);
            padding: 15px; display: flex; flex-direction: column; align-items: center;
        }
        
        .ship-header-container { width: 100%; max-width: 400px; text-align: center; margin-bottom: 8px; }
        .ship-title { color: #ffeb3b; font-weight: bold; font-size: 22px; font-family: Arial, sans-serif; text-shadow: 1px 1px 2px #000; }
        .ship-desc { color: #ccc; font-size: 13px; margin-top: 3px; font-family: Arial, sans-serif; text-shadow: 1px 1px 2px #000; }

        .ship-selector {
            display: flex; gap: 10px; overflow-x: auto; max-width: 100%; 
            padding: 8px 5px; scroll-behavior: smooth; margin-bottom: 12px;
        }
        .ship-selector::-webkit-scrollbar { display: none; }
        .ship-thumb {
            width: 60px; height: 60px; background: rgba(0,0,0,0.7); border: 3px solid #333; 
            padding: 5px; cursor: pointer; transition: 0.2s;
            opacity: 0.5; flex-shrink: 0; display: flex; justify-content: center; align-items: center;
            position: relative; border-radius: 4px;
        }
        .ship-thumb.selected { border-color: #00ffcc; opacity: 1; transform: scale(1.08); background: rgba(0,0,0,0.9); }
        .ship-thumb.equipped { border-color: #ffeb3b; }
        .ship-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .ship-action-container { width: 100%; max-width: 400px; min-height: 140px; }

        .btn-equip, .btn-buy {
            background: #000; border: 4px solid; padding: 10px; font-weight: bold; cursor: pointer; font-size: 15px;
            text-transform: uppercase; width: 100%; text-align: center; transition: 0.2s; border-radius: 4px;
        }
        .btn-equip { color: #ffeb3b; border-color: #ffeb3b; margin-bottom: 10px; }
        .btn-equip:hover { background: #ffeb3b; color: #000; }
        
        .btn-buy { color: #ffeb3b; border-color: #ffeb3b; padding: 12px 20px; }
        .btn-buy:hover { background: #ffeb3b; color: #000; }

        .equipped-status {
            color: #ffeb3b; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 8px;
            text-transform: uppercase; letter-spacing: 1px; text-shadow: 1px 1px 2px #000;
        }

        .stat-row { margin-bottom: 8px; }
        .stat-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 3px; }
        .stat-name { font-weight: bold; color: #fff; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 1px 1px 2px #000;}
        
        .progress-bar-container { display: flex; width: 100%; height: 16px; border: 3px solid #00ffcc; background-color: rgba(0,0,0,0.8); }
        .progress-block { flex: 1; border-right: 3px solid #00ffcc; }
        .progress-block:last-child { border-right: none; }
        .progress-block.active { background-color: #00ffcc; }

        .btn-up { background: #000; color: #00ffcc; border: 3px solid #00ffcc; padding: 2px 10px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-up:disabled { color: #555; border-color: #555; cursor: not-allowed; }
        .btn-up:hover:not(:disabled) { background: #00ffcc; color: #000; }

        .locked-box { display: flex; justify-content: center; align-items: center; height: 100%; margin-top: 10px; }

        .hidden { display: none !important; }

        /* --- PAINEL DE MELHORIAS (CONSTRUÇÕES) --- */
        .improvements-panel {
            position: absolute;
            right: -280px;
            top: 0;
            width: 280px;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            border-left: 4px solid #ff6600;
            z-index: 20;
            transition: right 0.3s ease-out;
            overflow-y: auto;
            flex-direction: column;
            display: flex;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.8);
        }

        .improvements-panel.active {
            right: 0;
        }

        .improvements-header {
            background: linear-gradient(135deg, #ff6600, #ff8833);
            color: #fff;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 2px solid #ff6600;
        }

        .improvements-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .improvements-content::-webkit-scrollbar {
            width: 6px;
        }

        .improvements-content::-webkit-scrollbar-track {
            background: rgba(255, 102, 0, 0.1);
        }

        .improvements-content::-webkit-scrollbar-thumb {
            background: #ff6600;
            border-radius: 3px;
        }

        .building-item {
            background: rgba(20, 20, 30, 0.8);
            border: 2px solid #ff6600;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .building-item:hover:not(.disabled) {
            background: rgba(255, 102, 0, 0.2);
            transform: translateX(-5px);
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.4);
        }

        .building-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #555;
        }

        .building-name {
            color: #ff6600;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .building-desc {
            color: #aaa;
            font-size: 11px;
            margin-bottom: 8px;
        }

        .building-price {
            color: #ffeb3b;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .building-btn {
            width: 100%;
            background: #ff6600;
            border: none;
            color: #000;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 12px;
        }

        .building-btn:hover:not(:disabled) {
            background: #ff8833;
            transform: scale(1.05);
        }

        .building-btn:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }

        .toggle-improvements-btn {
            position: absolute;
            right: 15px;
            top: 70px;
            z-index: 19;
            background: #ff6600;
            border: none;
            color: #000;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 12px;
        }

        .toggle-improvements-btn:hover {
            background: #ff8833;
            transform: scale(1.1);
        }

        .toggle-improvements-btn.active {
            background: #00ffcc;
            color: #000;
        }

        /* --- TELA DA BASE (CONSTRUÇÃO VISUAL COM DRAG-AND-DROP) --- */
        .base-buildings-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
        }

        .building-instance {
            position: absolute;
            width: 24%;
            aspect-ratio: 1 / 1;
            transform: translate(-50%, -50%);
            cursor: grab;
            touch-action: none;
            z-index: 3;
        }
        .building-instance.dragging {
            cursor: grabbing;
            z-index: 15;
            filter: drop-shadow(0 0 14px rgba(0, 255, 204, 0.9));
        }
        .building-instance img {
            width: 100%; height: 100%; object-fit: contain;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.6));
            pointer-events: none;
            -webkit-user-drag: none;
            user-select: none;
        }

        .btn-back-base {
            position: absolute; left: 15px; top: 15px; z-index: 19;
            background: #000; border: 3px solid #00ffcc; color: #00ffcc;
            padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;
            font-size: 12px; transition: 0.2s;
        }
        .btn-back-base:hover { background: #00ffcc; color: #000; }

        .base-currency-display {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 19; font-size: 16px; font-weight: bold; padding: 6px 14px;
            background: rgba(0,0,0,0.85); border-radius: 6px; font-family: Arial, sans-serif;
            color: #ffeb3b; border: 3px solid #ffeb3b; box-shadow: 0 0 10px rgba(255, 235, 59, 0.3);
        }

        .toggle-build-btn {
            position: absolute; right: 15px; top: 15px; z-index: 19;
            background: #ff6600; border: none; color: #000;
            padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;
            transition: 0.3s; font-size: 12px;
        }
        .toggle-build-btn:hover { background: #ff8833; transform: scale(1.1); }
        .toggle-build-btn.active { background: #00ffcc; color: #000; }

        .build-panel {
            position: absolute; right: -280px; top: 0; width: 280px; height: 100%;
            background: rgba(0, 0, 0, 0.95); border-left: 4px solid #ff6600; z-index: 20;
            transition: right 0.3s ease-out; overflow-y: auto;
            display: flex; flex-direction: column;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.8);
        }
        .build-panel.active { right: 0; }

        .build-header {
            background: linear-gradient(135deg, #ff6600, #ff8833); color: #fff;
            padding: 15px; text-align: center; font-weight: bold; font-size: 18px;
            border-bottom: 2px solid #ff6600;
        }

        .build-content { flex: 1; padding: 15px; overflow-y: auto; }

        .build-item {
            display: flex; align-items: center; gap: 10px;
            background: rgba(20, 20, 30, 0.8); border: 2px solid #ff6600; border-radius: 6px;
            padding: 10px; margin-bottom: 12px;
        }
        .build-item-thumb {
            width: 48px; height: 48px; object-fit: contain; flex-shrink: 0;
        }
        .build-item-info { flex: 1; min-width: 0; }
        .build-item-name { color: #ff6600; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
        .build-item-price { color: #ffeb3b; font-weight: bold; font-size: 12px; }
        .build-item-btn {
            background: #ff6600; border: none; color: #000; padding: 8px 10px;
            border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px;
            flex-shrink: 0; transition: 0.2s;
        }
        .build-item-btn:hover:not(:disabled) { background: #ff8833; transform: scale(1.05); }
        .build-item-btn:disabled { background: #555; color: #999; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="menu">
    <div class="top-ui-container">
        <div class="currency-display">
            <div class="currency-item gems">💎 <span id="gemCount">0</span></div>
            <div class="currency-item coins">💰 <span id="coinCount">0</span></div>
        </div>
    </div>

    <div class="store-top-bar">
        <p class="store-top-title">🛒 LOJA ESPACIAL</p>
        <div class="store-items-row">
            <button class="store-mini-btn buy-gem" onclick="buyGemsFake(50)">+50 💎 (R$ 4,90)</button>
            <button class="store-mini-btn buy-gem" onclick="buyGemsFake(150)">+150 💎 (R$ 9,90)</button>
            <button class="store-mini-btn buy-coin" onclick="convertGemsToCoins(10, 1000)">10 💎 ➔ 1k 💰</button>
            <button class="store-mini-btn buy-coin" onclick="convertGemsToCoins(50, 5500)">50 💎 ➔ 5.5k 💰</button>
        </div>
    </div>
    
    <div class="center-area">
        <button id="btnPlay" class="btn-play" onclick="startGame()">▶ FASE 1</button>
        <button id="btnBase" class="btn-base" onclick="openBase()">🏗️ BASE</button>
    </div>

    <div class="bottom-area">
        <div id="shipHeader" class="ship-header-container"></div>
        <div id="shipSelector" class="ship-selector"></div>
        <div id="shipAction" class="ship-action-container"></div>
    </div>
</div>

<div id="game-container">
    <canvas id="gameCanvas" width="1080" height="1920"></canvas>
    <div id="explosions-layer"></div>
    
    <!-- PAINEL DE MELHORIAS -->
    <button class="toggle-improvements-btn" onclick="toggleImprovementsPanel()">🔧 MELHORIAS</button>
    
    <div class="improvements-panel" id="improvementsPanel">
        <div class="improvements-header">⚔️ MELHORIAS DA BASE</div>
        <div class="improvements-content" id="improvementsContent"></div>
    </div>
</div>

<div id="base-container">
    <div class="base-buildings-layer" id="baseBuildingsLayer"></div>

    <button class="btn-back-base" onclick="closeBase()">⬅ VOLTAR</button>
    <div class="base-currency-display">💰 <span id="coinCountBase">0</span></div>
    <button class="toggle-build-btn" onclick="toggleBuildPanel()">🏗️ CONSTRUIR</button>

    <div class="build-panel" id="buildPanel">
        <div class="build-header">🏗️ CONSTRUÇÕES</div>
        <div class="build-content" id="buildContent"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const menu = document.getElementById("menu");
    const gameContainer = document.getElementById("game-container");
    const explosionsLayer = document.getElementById("explosions-layer");

    const shipHeaderDiv = document.getElementById('shipHeader');
    const shipSelectorDiv = document.getElementById('shipSelector');
    const shipActionDiv = document.getElementById('shipAction');
    const btnPlay = document.getElementById('btnPlay');
    
    const coinCountEl = document.getElementById('coinCount');
    const gemCountEl = document.getElementById('gemCount');

    const audioTiro = new Audio('assets/tiro.mp3');
    const audioExplosao = new Audio('assets/explosao.mp3');
    const audioDano = new Audio('assets/dano.mp3');
    const audioClick = new Audio('assets/click.mp3');

    // ========== SISTEMA DE CONSTRUÇÕES ==========
    const BUILDINGS = {
        centro: { 
            name: 'Centro de Comando', 
            desc: 'Aumenta resistência em 2 HP',
            price: 200, 
            effect: () => { player.maxHealth += 2; player.health += 2; },
            icon: '🏛️'
        },
        abrigo: { 
            name: 'Abrigo', 
            desc: 'Restaura 3 HP',
            price: 150, 
            effect: () => { player.health = Math.min(player.health + 3, player.maxHealth); },
            icon: '🏠'
        },
        fabrica: { 
            name: 'Fábrica de Munição', 
            desc: 'Aumenta dano em 20%',
            price: 250, 
            effect: () => { 
                currentShip.baseDmg = Math.round(currentShip.baseDmg * 1.2);
                currentShip.actDmg = Math.round(currentShip.actDmg * 1.2);
            },
            icon: '🏭'
        }
    };

    function toggleImprovementsPanel() {
        const panel = document.getElementById('improvementsPanel');
        const btn = document.querySelector('.toggle-improvements-btn');
        panel.classList.toggle('active');
        btn.classList.toggle('active');
    }

    function renderImprovementsPanel() {
        const content = document.getElementById('improvementsContent');
        content.innerHTML = '';

        Object.keys(BUILDINGS).forEach(key => {
            const building = BUILDINGS[key];
            const canBuy = coins >= building.price;
            
            const itemDiv = document.createElement('div');
            itemDiv.className = `building-item ${!canBuy ? 'disabled' : ''}`;
            
            itemDiv.innerHTML = `
                <div class="building-name">${building.icon} ${building.name}</div>
                <div class="building-desc">${building.desc}</div>
                <div class="building-price">💰 ${building.price}</div>
                <button class="building-btn" 
                    onclick="buyBuilding('${key}')" 
                    ${!canBuy ? 'disabled' : ''}>
                    COMPRAR
                </button>
            `;
            
            content.appendChild(itemDiv);
        });
    }

    function buyBuilding(buildingKey) {
        const building = BUILDINGS[buildingKey];
        
        if (coins < building.price) {
            alert('Moedas insuficientes!');
            return;
        }

        coins -= building.price;
        coinCountEl.innerText = coins;
        building.effect();
        renderImprovementsPanel();
        
        // Feedback visual
        const panel = document.getElementById('improvementsPanel');
        panel.style.borderLeftColor = '#00ff00';
        setTimeout(() => {
            panel.style.borderLeftColor = '#ff6600';
        }, 300);
    }

    // ========== SISTEMA DE BASE VISUAL (TELA INICIAL) ==========
    const baseContainerEl = document.getElementById('base-container');
    const baseBuildingsLayer = document.getElementById('baseBuildingsLayer');
    const coinCountBaseEl = document.getElementById('coinCountBase');

    const BASE_BUILDINGS_CATALOG = {
        centro: { name: 'Centro de Comando', price: 300, img: 'assets/centro.png' },
        abrigo: { name: 'Abrigo', price: 200, img: 'assets/abrigo.png' },
        fabrica: { name: 'Fábrica', price: 350, img: 'assets/fabrica.png' }
    };

    let baseBuildings = []; // { id, type, x, y } -> x/y em % do container (posição do CENTRO da construção)
    let baseBuildingCounter = 0;

    const BUILDING_W_PCT = 24; // largura da construção em % da largura da base
    const BUILDING_H_PCT = BUILDING_W_PCT * (9 / 16); // altura equivalente em % da altura (base é 9:16, mantém quadrado real na tela)

    function openBase() {
        tocarSom(audioClick, 0.3);
        menu.classList.add('hidden');
        baseContainerEl.style.display = 'flex';
        coinCountBaseEl.innerText = coins;
        renderBuildPanel();
    }

    function closeBase() {
        tocarSom(audioClick, 0.3);
        document.getElementById('buildPanel').classList.remove('active');
        document.querySelector('.toggle-build-btn').classList.remove('active');
        baseContainerEl.style.display = 'none';
        menu.classList.remove('hidden');
    }

    function toggleBuildPanel() {
        const panel = document.getElementById('buildPanel');
        const btn = document.querySelector('.toggle-build-btn');
        panel.classList.toggle('active');
        btn.classList.toggle('active');
    }

    function renderBuildPanel() {
        const content = document.getElementById('buildContent');
        content.innerHTML = '';

        Object.keys(BASE_BUILDINGS_CATALOG).forEach(key => {
            const b = BASE_BUILDINGS_CATALOG[key];
            const canBuy = coins >= b.price;

            const item = document.createElement('div');
            item.className = 'build-item';
            item.innerHTML = `
                <img class="build-item-thumb" src="${b.img}" alt="${b.name}">
                <div class="build-item-info">

    // Verifica se a posição (x,y) colide com alguma construção já existente (exceto a própria, ao arrastar)
    function hasCollision(x, y, ignoreId) {
        for (const b of baseBuildings) {
            if (b.id === ignoreId) continue;
            if (Math.abs(b.x - x) < BUILDING_W_PCT && Math.abs(b.y - y) < BUILDING_H_PCT) {
                return true;
            }
        }
        return false;
    }

    // Acha um espaço livre em grade para posicionar uma construção recém-comprada
    function findFreeSpot() {
        const halfX = BUILDING_W_PCT / 2;
        const halfY = BUILDING_H_PCT / 2;
        const marginX = 8, marginY = 6;
        const gapX = 6, gapY = 5;

        for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 3; col++) {
                const x = marginX + halfX + col * (BUILDING_W_PCT + gapX);
                const y = marginY + halfY + row * (BUILDING_H_PCT + gapY);
                if (x + halfX <= 100 - marginX && y + halfY <= 100 - marginY && !hasCollision(x, y, null)) {
                    return { x, y };
                }
            }
        }
        return { x: 50, y: 50 }; // fallback caso a base esteja muito cheia
    }

    function buyBaseBuilding(type) {
        const b = BASE_BUILDINGS_CATALOG[type];
        if (coins < b.price) {

    }

    // Drag-and-drop via Pointer Events (funciona com mouse e toque)
    function attachDragHandlers(el, buildingData) {
        let dragging = false;
        let lastValidX = buildingData.x;
        let lastValidY = buildingData.y;

        el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            dragging = true;
            lastValidX = buildingData.x;
            lastValidY = buildingData.y;
            el.classList.add('dragging');
            el.setPointerCapture(e.pointerId);
        });

        el.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            const rect = baseBuildingsLayer.getBoundingClientRect();
            const halfX = BUILDING_W_PCT / 2;
            const halfY = BUILDING_H_PCT / 2;

            let px = ((e.clientX - rect.left) / rect.width) * 100;
            let py = ((e.clientY - rect.top) / rect.height) * 100;

            px = Math.max(halfX, Math.min(100 - halfX, px));
            py = Math.max(halfY, Math.min(100 - halfY, py));

            buildingData.x = px;
            buildingData.y = py;
            el.style.left = px + '%';
            el.style.top = py + '%';
        });

        function endDrag() {
            if (!dragging) return;
            dragging = false;
            el.classList.remove('dragging');

            // Se soltou em cima de outra construção, volta para a última posição válida
            if (hasCollision(buildingData.x, buildingData.y, buildingData.id)) {
                buildingData.x = lastValidX;
                buildingData.y = lastValidY;
                el.style.left = lastValidX + '%';
                el.style.top = lastValidY + '%';
            }
        }

        el.addEventListener('pointerup', endDrag);
        el.addEventListener('pointercancel', endDrag);
    }

    function checkDoubleTap() {

    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        return (clientX - rect.left) * (canvas.width / rect.width);
    }

    canvas.addEventListener('mousedown', (e) => { isMouseDown = true; checkDoubleTap(); updatePlayerPosition(getCanvasPos(e)); if (gameOver || victory) returnToMenu(); });

    window.addEventListener('mouseup', () => isMouseDown = false);

    function shoot() {
        tocarSom(audioTiro, 0.4); 
        let isPowered = player.powerState === 'active';
        let bSpeed = isPowered && currentShip.type === 'wave' ? 16 : 24;
        let bType = isPowered ? currentShip.type : 'normal';
        let bW = isPowered ? currentShip.actW : currentShip.baseW;
        let bH = isPowered ? currentShip.actH : currentShip.baseH;
        let bDmg = isPowered ? currentShip.actDmg + currentShip.upgrades.power : currentShip.baseDmg;
        let pY = player.y - 15;

        if (bType === 'double') {
            bullets.push({ x: player.x + 10, y: pY, w: bW, h: bH, speed: bSpeed, type: bType, damage: bDmg });
            bullets.push({ x: player.x + player.w - 40, y: pY, w: bW, h: bH, speed: bSpeed, type: bType, damage: bDmg });
        } else if (bType === 'wave') {
            bullets.push({ x: player.x + player.w/2 - bW/2, y: pY - 30, w: bW, h: bH, speed: bSpeed, type: bType, damage: bDmg, hitTargets: [] });
        } else if (bType === 'piercing') {
            bullets.push({ x: player.x + player.w/2 - bW/2, y: pY, w: bW, h: bH, speed: 28, type: bType, damage: bDmg, hitTargets: [] });
        } else {
            bullets.push({ x: player.x + player.w/2 - bW/2, y: pY, w: bW, h: bH, speed: bSpeed, type: bType, damage: bDmg });
        }
    }

    function update(dt) {
        if (damageFlashAlpha > 0) {
            damageFlashAlpha -= dt / 500; 
            if (damageFlashAlpha < 0) damageFlashAlpha = 0;
        }

        if (!bossSpawned) {
            phaseTimer += dt;
            
            for(let i = resgateSpawnTimes.length - 1; i >= 0; i--) {
                if (phaseTimer >= resgateSpawnTimes[i]) {
                    spawnResgate();
                    resgateSpawnTimes.splice(i, 1);
                }
            }

            if (phaseTimer >= phaseDuration) { bossSpawned = true; spawnBoss(); } 
            else { spawnTimer += dt; if (spawnTimer >= currentSpawnInterval) { spawnMeteor(); spawnTimer = 0; } }
        }

        if (bossSpawned && meteors.length === 0 && !gameOver && !victory) {
            victory = true; winStreak++; deathCountOnPhase = 0; 
            coinsGanhasNestaFase = 50 + (currentPhase * 25);
            atualizarMoedas(coinsGanhasNestaFase);
            currentPhase++;
            if (winStreak >= 5) { difficultyMultiplier += 0.10; winStreak = 0; }
        }

        if (victory || gameOver) return;

        if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) player.x -= player.speed;
        if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.w) player.x += player.speed;

        if (player.powerState === 'active') {
            player.powerTimer -= dt;
            if (player.powerTimer <= 0) { player.powerState = 'cooldown'; player.powerTimer = player.cooldownDuration; }
        } else if (player.powerState === 'cooldown') {
            player.powerTimer -= dt;
            if (player.powerTimer <= 0) { player.powerState = 'ready'; player.powerTimer = 0; }
        }

        let interval = (player.powerState === 'active') ? currentShip.activeInterval : 300;
        if ((keys['Space'] || performance.now() - lastShootTime > interval)) { shoot(); lastShootTime = performance.now(); }

        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= bullets[i].speed;
            if (bullets[i].y < -80) bullets.splice(i, 1);
        }

        for (let i = meteors.length - 1; i >= 0; i--) {
            let m = meteors[i];
            m.y += m.speed;

            if (m.y > canvas.height) {
                takeDamage(m.isBoss ? 10 : 1);
                meteors.splice(i, 1);
                continue;
            }

            if (m.x < player.x + player.w && m.x + m.w > player.x && 
                m.y < player.y + player.h && m.y + m.h > player.y) {
                let dano = m.isBoss ? 10 : (m.isResgate ? 3 : 1);
                takeDamage(dano);

                if (!m.isBoss) {
                    showExplosion(m.x, m.y, m.w, m.h);
                    meteors.splice(i, 1);
                }
                continue;
            }

            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (b.x < m.x + m.w && b.x + b.w > m.x && b.y < m.y + m.h && b.y + b.h > m.y) {
                    if (b.type === 'piercing' || b.type === 'wave') {
                        if (!b.hitTargets.includes(m.id)) {
                            m.health -= b.damage;
                            b.hitTargets.push(m.id);
                            if (b.type === 'wave') m.y -= m.isBoss ? 25 : 200;
                        }
                    } else {
                        m.health -= b.damage;
                        bullets.splice(j, 1);
                    }

                    if (m.health <= 0) {
                        showExplosion(m.x, m.y, m.w, m.h);

                        if (m.isResgate) atualizarMoedas(50);

                        meteors.splice(i, 1);
                        break;
                    }
                }
            }
        }
    }

    function checkGameOver() {
        if (player.health <= 0 && !gameOver) {
            player.health = 0;
            gameOver = true;
            winStreak = 0;
            deathCountOnPhase++;
            if (deathCountOnPhase >= 5) {
                difficultyMultiplier = Math.max(0.5, difficultyMultiplier - 0.10);
                deathCountOnPhase = 0;
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let nImg = images.naves[currentShip.id];
        if (nImg.complete && nImg.naturalHeight !== 0) ctx.drawImage(nImg, player.x, player.y, player.w, player.h);
        else { ctx.fillStyle = "cyan"; ctx.fillRect(player.x, player.y, player.w, player.h); }

        ctx.fillStyle = player.health <= 3 ? "#ff4444" : "#00ffff"; 
        ctx.font = "bold 32px Arial"; 
        ctx.textAlign = "center";
        ctx.fillText("HP: " + player.health + "/" + player.maxHealth, player.x + player.w / 2, player.y - 20);

        meteors.forEach(m => {
            let imgRender = m.isResgate ? images.resgate : images.meteoro;

            if (imgRender.complete && imgRender.naturalHeight !== 0) {
                ctx.drawImage(imgRender, m.x, m.y, m.w, m.h);
            } else {
                ctx.fillStyle = m.isBoss ? "darkred" : (m.isResgate ? "blue" : "orange");
                ctx.fillRect(m.x, m.y, m.w, m.h);
            }

            ctx.textAlign = "center"; 
            ctx.textBaseline = "middle";
            ctx.font = m.isBoss ? "bold 120px Arial" : (m.isResgate ? "bold 75px Arial" : "bold 65px Arial");
            ctx.lineWidth = 6; 
            ctx.strokeStyle = "#000000"; 
            ctx.fillStyle = m.isBoss ? "#ff3333" : (m.isResgate ? "#00e5ff" : "#ffffff"); 

            let textX = m.x + m.w / 2; 
            let textY = m.y + m.h / 2;
            ctx.strokeText(m.health, textX, textY); 
            ctx.fillText(m.health, textX, textY);
        });

        let tImg = images.tiros[currentShip.id];
        bullets.forEach(b => {
            if (tImg.complete && tImg.naturalHeight !== 0) ctx.drawImage(tImg, b.x, b.y, b.w, b.h);
            else { ctx.fillStyle = "yellow"; ctx.fillRect(b.x, b.y, b.w, b.h); }
        });

        if (damageFlashAlpha > 0) {
            let gradH = 500; 
            let grad = ctx.createLinearGradient(0, canvas.height - gradH, 0, canvas.height);
            grad.addColorStop(0, "rgba(255, 0, 0, 0)"); 
            grad.addColorStop(1, `rgba(255, 0, 0, ${damageFlashAlpha * 0.8})`); 
            ctx.fillStyle = grad;
            ctx.fillRect(0, canvas.height - gradH, canvas.width, gradH);
        }

        let topBarW = 600; 
        let topBarH = 35; 
        let topBarX = canvas.width / 2 - topBarW / 2; 
        let topBarY = 40;
        ctx.fillStyle = "rgba(34, 34, 34, 0.8)"; 
        ctx.fillRect(topBarX, topBarY, topBarW, topBarH);
        ctx.strokeStyle = "#555"; 
        ctx.strokeRect(topBarX, topBarY, topBarW, topBarH);
        ctx.textBaseline = "alphabetic"; 

        if (bossSpawned) {
            ctx.fillStyle = "#ff0000"; 
            ctx.fillRect(topBarX, topBarY, topBarW, topBarH); 
            ctx.fillStyle = "#ffffff"; 
            ctx.font = "bold 22px Arial"; 
            ctx.fillText("ALERTA: CHEFE GIGANTE!", canvas.width / 2, topBarY + 24);
        } else {
            let phasePct = Math.min(1, phaseTimer / phaseDuration);
            ctx.fillStyle = "#00ffcc"; 
            ctx.fillRect(topBarX, topBarY, topBarW * phasePct, topBarH);
            ctx.fillStyle = "#ffffff"; 
            ctx.font = "bold 22px Arial"; 
            ctx.fillText("FASE " + currentPhase, canvas.width / 2, topBarY + 24);
        }

        let barW = 500; 
        let barH = 30; 
        let barX = canvas.width / 2 - barW / 2; 
        let barY = canvas.height - 60;
        ctx.fillStyle = "rgba(34, 34, 34, 0.8)"; 
        ctx.fillRect(barX, barY, barW, barH);
        ctx.strokeStyle = "#555"; 
        ctx.strokeRect(barX, barY, barW, barH);

        let fillPct = 1;
        if (player.powerState === 'active') fillPct = player.powerTimer / player.powerDuration;
        else if (player.powerState === 'cooldown') fillPct = 1 - (player.powerTimer / player.cooldownDuration);

        if (player.powerState === 'ready') ctx.fillStyle = "#00ff88"; 
        else if (player.powerState === 'active') ctx.fillStyle = "#ffcc00"; 
        else ctx.fillStyle = "#ff4444"; 

        ctx.fillRect(barX, barY, barW * fillPct, barH);

        if (victory) {
            ctx.fillStyle = "rgba(0, 50, 0, 0.85)"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ffcc"; 
            ctx.font = "bold 70px Arial"; 
            ctx.fillText("VITÓRIA!", canvas.width / 2, canvas.height / 2 - 50);
            ctx.fillStyle = "#ffeb3b"; 
            ctx.font = "bold 36px Arial"; 
            ctx.fillText("+ 💰 " + coinsGanhasNestaFase + " Moedas!", canvas.width / 2, canvas.height / 2 + 20);
            ctx.fillStyle = "#ffffff"; 
            ctx.font = "24px Arial"; 
            ctx.fillText("Toque para voltar ao menu", canvas.width / 2, canvas.height / 2 + 80);
        }

        if (gameOver) {
            ctx.fillStyle = "rgba(50, 0, 0, 0.85)"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff3333"; 
            ctx.font = "bold 70px Arial"; 
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);
            ctx.fillStyle = "#ffffff"; 
            ctx.font = "26px Arial"; 
            ctx.fillText("Toque para voltar ao menu", canvas.width / 2, canvas.height / 2 + 40);
        }
    }

    function loop(timestamp) {
        if (!isPlaying) return;
        let dt = timestamp - lastFrameTime;
        if (dt > 100) dt = 16;
        lastFrameTime = timestamp;

        if (!gameOver && !victory) update(dt);
        draw();
        requestAnimationFrame(loop);
    }

    renderMenu();
</script>
</body>
</html>
